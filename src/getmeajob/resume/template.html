<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1a1a1a;
         font-size: 9.6pt; line-height: 1.32; }
  .page { width: 7.5in; margin: 0 auto; }
  h1 { font-size: 20pt; margin: 0 0 2pt; letter-spacing: 0.2pt; }
  h2 { font-size: 10pt; text-transform: uppercase; letter-spacing: 1pt; margin: 11pt 0 4pt;
       padding-bottom: 2pt; border-bottom: 0.75pt solid #444; }
  p { margin: 0 0 3pt; }
  .contact { color: #333; margin-bottom: 2pt; }
  .contact > span { white-space: nowrap; }
  .contact > span + span::before { content: " | "; color: #888; }
  .contact a { color: inherit; text-decoration: none; }
  .role { margin-bottom: 6pt; break-inside: avoid; }
  .role-head { display: flex; justify-content: space-between; gap: 12pt; }
  .dates { color: #444; white-space: nowrap; }
  ul { margin: 2pt 0 0; padding-left: 14pt; }
  li { margin: 0 0 1.5pt; }
  .skills { margin-bottom: 2pt; }
</style>
</head>
<body>
<main class="page">
{{body}}
</main>
</body>
</html>
