# Your own answers to form questions the rules cannot answer from your profile.
# The most specific answer wins: by_job, then by_company, then global.
# `getmeajob plan unknowns --stub FILE` writes the open questions for you to fill in,
# and `getmeajob plan answer FILE` merges them back here.

# Answers for any job, keyed by the question label as the form shows it.
# Example:  "Preferred work arrangement": Hybrid
global: {}

# Answers for one company, keyed by its board slug, then by question label.
# Example:  examplecorp: {"Why do you want to join Example Corp?": "..."}
by_company: {}

# Answers for one job, keyed by job key, then by question id or label.
# A value can be text, or {value: ..., needs_review: true} for drafts you still need to check.
# Example:  "greenhouse:examplecorp:1001": {question_2005: "..."}
by_job: {}
