[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "getmeajob"
version = "0.1.0"
description = "A job hunt as a pipeline of plain scripts that agents drive: source, rank, plan, apply, track."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yash Bhardwaj", email = "yashbhardwaj911@gmail.com" }]
keywords = ["jobs", "job-search", "greenhouse", "ashby", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/y4shb/getmeajob"
Repository = "https://github.com/y4shb/getmeajob"
Issues = "https://github.com/y4shb/getmeajob/issues"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
llm = ["anthropic>=2.14"]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
all = ["getmeajob[browser,llm,mcp]"]

[project.scripts]
getmeajob = "getmeajob.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/getmeajob"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "getmeajob/_examples"
"agents" = "getmeajob/_agents"
"config" = "getmeajob/_config"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/.claude-plugin",
    "/agents",
    "/config",
    "/docs",
    "/examples",
    "/scripts",
    "/tests",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["playwright.*", "anthropic.*", "mcp.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "browser: needs Playwright and Chromium",
    "slow: takes more than a few seconds",
]
